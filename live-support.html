<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Live Support</title>
<style>
  :root{
    --bg:#0B0D12;
    --panel:#12151D;
    --panel-2:#181C27;
    --border:#242938;
    --gold:#F0B90B;
    --text:#F5F6FA;
    --text-dim:#8B93A7;
    --bubble-user:#F0B90B;
    --bubble-user-text:#12151D;
    --bubble-admin:#1E2330;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;
    color:var(--text);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    touch-action:pan-y;
    position:fixed;
    inset:0;
    width:100%;
  }
  .chat-shell{
    max-width:480px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    height:calc(var(--app-height, 100vh));
    display:flex;
    flex-direction:column;
    background:var(--panel);
    overflow:hidden;
  }
  .chat-header{
    flex-shrink:0;
  }
  .composer{
    flex-shrink:0;
  }
  .topics-panel{
    flex-shrink:0;
  }
  .chat-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 18px;
    border-bottom:1px solid var(--border);
    background:var(--panel-2);
  }
  .chat-header .avatar{
    width:38px;height:38px;border-radius:50%;
    background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
  }
  .chat-header .title{font-weight:600;font-size:15px;}
  .chat-header .status{font-size:12px;color:#16C784;display:flex;align-items:center;gap:5px;}
  .chat-header .status::before{content:"";width:6px;height:6px;border-radius:50%;background:#16C784;}
  .chat-header .status.typing{color:var(--gold);}
  .chat-header .status.typing::before{background:var(--gold);}
  .chat-header .back{
    background:none;border:none;color:var(--text-dim);
    font-size:22px;cursor:pointer;line-height:1;
  }
  .messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  /* ---- Message row: holds the avatar + bubble side by side ---- */
  .msg-row{
    display:flex;
    align-items:flex-end;
    gap:8px;
    max-width:100%;
  }
  .msg-row.customer{ justify-content:flex-end; align-self:flex-end; }
  .msg-row.admin{ justify-content:flex-start; align-self:flex-start; }

  .msg-avatar{
    width:28px;height:28px;border-radius:50%;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:600;
    overflow:hidden;
  }
  .msg-avatar.admin{
    background:var(--gold);
    color:#12151D;
    font-size:15px;
  }
  .msg-avatar.customer{
    background:#3A4155;
    color:#fff;
  }
  .msg-avatar img{
    width:100%;height:100%;object-fit:cover;
  }

  .msg{
    max-width:78%;
    padding:10px 14px;
    border-radius:14px;
    font-size:14px;
    line-height:1.45;
    word-wrap:break-word;
  }
  .msg.system{
    align-self:center;
    background:transparent;
    color:var(--text-dim);
    font-size:12px;
    text-align:center;
    max-width:90%;
  }
  .msg.customer{
    background:var(--bubble-user);
    color:var(--bubble-user-text);
    border-bottom-right-radius:4px;
  }
  .msg.admin{
    background:var(--bubble-admin);
    color:var(--text);
    border-bottom-left-radius:4px;
  }
  .msg .time{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:10px;
    opacity:.6;
    margin-top:4px;
  }
  .msg .tick{
    font-size:11px;
  }
  .composer{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid var(--border);
    background:var(--panel-2);
  }
  .composer input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:22px;
    padding:11px 16px;
    color:var(--text);
    font-size:16px;
    outline:none;
  }
  .composer input:focus{border-color:var(--gold);}
  .composer button{
    background:var(--gold);
    color:#12151D;
    border:none;
    border-radius:50%;
    width:42px;height:42px;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
  }
  .composer button:disabled{opacity:.5;cursor:default;}
  .topics-toggle{
    background:none;border:none;color:var(--text-dim);
    font-size:18px;cursor:pointer;padding:4px;line-height:1;
  }
  .topics-toggle:hover{color:var(--gold);}
  .topics-panel{
    background:var(--panel-2);
    border-top:1px solid var(--border);
    padding:12px 14px;
  }
  .topics-title{
    font-size:11px;color:var(--text-dim);font-weight:600;
    margin-bottom:10px;letter-spacing:.02em;
  }
  .topics-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
  }
  .topic-btn{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:var(--bg);border:1px solid var(--border);border-radius:10px;
    padding:10px 4px 8px;cursor:pointer;color:var(--text);
    font-size:10.5px;text-align:center;line-height:1.25;
  }
  .topic-btn:hover{border-color:var(--gold);}
  .topic-btn svg{width:20px;height:20px;stroke:var(--gold);flex-shrink:0;}
  .name-gate{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:24px;
    text-align:center;
  }
  .name-gate h2{margin:0;font-size:18px;}
  .name-gate p{margin:0;color:var(--text-dim);font-size:13px;}
  .name-gate input{
    width:100%;max-width:280px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-size:16px;
    outline:none;
  }
  .name-gate input:focus{border-color:var(--gold);}
  .name-gate button{
    width:100%;max-width:280px;
    background:var(--gold);
    color:#12151D;
    border:none;
    border-radius:10px;
    padding:12px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="chat-shell">
  <div class="chat-header">
    <div class="avatar">🎧</div>
    <div>
      <div class="title">Live Support</div>
      <div class="status" id="statusLabel">Connecting…</div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:4px;">
      <button class="topics-toggle" id="topicsToggle" title="Topics">▦</button>
      <button class="back" onclick="history.back()">×</button>
    </div>
  </div>

  <div id="nameGate" class="name-gate">
    <h2>Chat with our support team</h2>
    <p>Enter your name to get started. Our agent will reply shortly.</p>
    <input id="nameInput" type="text" placeholder="Your name" maxlength="40">
    <button id="startBtn">Start chat</button>
  </div>

  <div class="messages" id="messages" style="display:none;"></div>

  <div class="topics-panel" id="topicsPanel" style="display:none;">
    <div class="topics-title">Topics</div>
    <div class="topics-grid">
      <button class="topic-btn" data-topic="ID Verification">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="12" r="2"/><line x1="13" y1="10" x2="18" y2="10"/><line x1="13" y1="14" x2="18" y2="14"/></svg>
        ID Verification
      </button>
      <button class="topic-btn" data-topic="Deposit & Withdrawal">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="2" y="6" width="20" height="13" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="6" y1="15" x2="10" y2="15"/></svg>
        Deposit &amp; Withdrawal
      </button>
      <button class="topic-btn" data-topic="Account Security">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>
        Account Security
      </button>
      <button class="topic-btn" data-topic="Wallet">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Wallet
      </button>
      <button class="topic-btn" data-topic="Financial Services">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><line x1="3" y1="21" x2="21" y2="21"/><path d="M4 21V10l8-6 8 6v11"/><line x1="9" y1="21" x2="9" y2="13"/><line x1="15" y1="21" x2="15" y2="13"/></svg>
        Financial Services
      </button>
      <button class="topic-btn" data-topic="Fiat & P2P">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 7h13M17 7l-3-3M17 7l-3 3"/><path d="M20 17H7M7 17l3 3M7 17l3-3"/></svg>
        Fiat &amp; P2P
      </button>
      <button class="topic-btn" data-topic="Crypto Trading">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><line x1="5" y1="4" x2="5" y2="20"/><rect x="3" y="9" width="4" height="6"/><line x1="12" y1="2" x2="12" y2="20"/><rect x="10" y="6" width="4" height="9"/><line x1="19" y1="6" x2="19" y2="20"/><rect x="17" y="12" width="4" height="5"/></svg>
        Crypto Trading
      </button>
      <button class="topic-btn" data-topic="More Features">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>
        More Features
      </button>
    </div>
  </div>

  <div class="composer" id="composer" style="display:none;">
    <input id="msgInput" type="text" placeholder="Type a message…" maxlength="1000">
    <button id="sendBtn">➤</button>
  </div>
</div>

<!-- Firebase SDK (compat, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  // ====== ১. এখানে আপনার নিজের Firebase কনফিগ বসান ======
  const firebaseConfig = {
    apiKey: "AIzaSyDJoPr8RvE1xkNTKRr5kwTx6E51GCMn_HE",
    authDomain: "abc-company-6272a.firebaseapp.com",
    projectId: "abc-company-6272a",
    storageBucket: "abc-company-6272a.firebasestorage.app",
    messagingSenderId: "1026212780106",
    appId: "1:1026212780106:web:985ec1bc35837d6320eeb3"
  };
  // =======================================================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ====== আসল ভিজিবল উচ্চতা ট্র্যাক করা (কিবোর্ড খুললেও হেডার স্থির থাকবে) ======
  function setAppHeight(){
    const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    document.documentElement.style.setProperty('--app-height', h + 'px');
    window.scrollTo(0, 0);
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', setAppHeight);
    window.visualViewport.addEventListener('scroll', setAppHeight);
  }
  // ==================================================================

  const nameGate   = document.getElementById('nameGate');
  const nameInput  = document.getElementById('nameInput');
  const startBtn   = document.getElementById('startBtn');
  const messagesEl = document.getElementById('messages');
  const composer   = document.getElementById('composer');
  const msgInput   = document.getElementById('msgInput');
  const sendBtn    = document.getElementById('sendBtn');
  const statusLabel= document.getElementById('statusLabel');
  const topicsPanel  = document.getElementById('topicsPanel');
  const topicsToggle = document.getElementById('topicsToggle');

  let currentCustomerName = '';

  topicsToggle.addEventListener('click', () => {
    topicsPanel.style.display = (topicsPanel.style.display === 'none') ? 'block' : 'none';
  });

  // ইনপুট বক্সে ক্লিক/ফোকাস করলে Topics প্যানেল স্বয়ংক্রিয়ভাবে লুকানো (নতুন)
  msgInput.addEventListener('focus', () => {
    topicsPanel.style.display = 'none';
  });

  document.querySelectorAll('.topic-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      msgInput.value = btn.dataset.topic;
      sendMessage();
      topicsPanel.style.display = 'none';
    });
  });

  // ====== ১২ ঘণ্টা সেশন মেয়াদ (নতুন) ======
  const SESSION_LIMIT_MS = 12 * 60 * 60 * 1000; // 12 hours

  function touchActivity(){
    localStorage.setItem('support_last_activity', Date.now().toString());
  }

  // প্রতিটি গ্রাহকের জন্য একটি স্থায়ী chatId (browser এ সংরক্ষিত)
  let chatId = localStorage.getItem('support_chat_id');
  const lastActivity = parseInt(localStorage.getItem('support_last_activity') || '0', 10);

  if (chatId && (Date.now() - lastActivity > SESSION_LIMIT_MS)) {
    // ১২ ঘণ্টার বেশি নিষ্ক্রিয় থাকলে পুরনো সেশন বাতিল করে নতুন শুরু
    localStorage.removeItem('support_chat_id');
    localStorage.removeItem('support_last_activity');
    chatId = null;
  }

  if (!chatId) {
    chatId = 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('support_chat_id', chatId);
  }
  touchActivity();

  const chatRef = db.collection('supportChats').doc(chatId);
  const msgsRef = chatRef.collection('messages');

  // ====== Typing indicator (নতুন) ======
  let typingTimeout = null;

  msgInput.addEventListener('input', () => {
    chatRef.set({ customerTyping: true }, { merge: true });
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      chatRef.set({ customerTyping: false }, { merge: true });
    }, 1500);
  });
  // ======================================

  function fmtTime(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date();
    return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  }

  // Builds the small circular avatar shown next to each bubble.
  // Admin -> headset icon. Customer -> first letter of their name.
  function buildAvatar(sender) {
    const div = document.createElement('div');
    div.className = 'msg-avatar ' + sender;
    if (sender === 'admin') {
      div.textContent = '🎧';
    } else {
      const initial = (currentCustomerName || '?').trim().charAt(0).toUpperCase() || '?';
      div.textContent = initial;
    }
    return div;
  }

  function renderMessage(sender, text, ts) {
    if (sender === 'system') {
      const sysDiv = document.createElement('div');
      sysDiv.className = 'msg system';
      sysDiv.textContent = text;
      messagesEl.appendChild(sysDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return;
    }

    const row = document.createElement('div');
    row.className = 'msg-row ' + sender;

    const bubble = document.createElement('div');
    bubble.className = 'msg ' + sender;
    const timeHtml = sender === 'customer'
      ? '<span class="time">' + fmtTime(ts) + ' <span class="tick">✓</span></span>'
      : '<span class="time">' + fmtTime(ts) + '</span>';
    bubble.innerHTML = text.replace(/</g,'&lt;') + timeHtml;

    const avatar = buildAvatar(sender);

    if (sender === 'customer') {
      // Bubble first, avatar after it, so the avatar sits on the far right.
      row.appendChild(bubble);
      row.appendChild(avatar);
    } else {
      // Avatar first, bubble after it, so the avatar sits on the far left.
      row.appendChild(avatar);
      row.appendChild(bubble);
    }

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function startChat(name) {
    currentCustomerName = name;
    touchActivity();
    nameGate.style.display = 'none';
    messagesEl.style.display = 'flex';
    composer.style.display = 'flex';
    topicsPanel.style.display = 'block';
    statusLabel.textContent = 'Online';

    chatRef.set({
      customerName: name,
      lastMessage: 'Chat started',
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
      unreadByAdmin: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    msgsRef.orderBy('timestamp').onSnapshot(snap => {
      messagesEl.innerHTML = '';
      snap.forEach(doc => {
        const m = doc.data();
        renderMessage(m.sender, m.text, m.timestamp);
      });
    });

    // ====== Typing indicator শোনা (adminTyping) ======
    chatRef.onSnapshot(doc => {
      const d = doc.data();
      if (!d) return;
      if (d.adminTyping) {
        statusLabel.textContent = 'Typing…';
        statusLabel.classList.add('typing');
      } else {
        statusLabel.textContent = 'Online';
        statusLabel.classList.remove('typing');
      }
    });
    // ===================================================
  }

  startBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    startChat(name);
  });
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') startBtn.click(); });

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;
    msgInput.value = '';
    touchActivity();

    clearTimeout(typingTimeout);

    msgsRef.add({
      sender: 'customer',
      text: text,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    chatRef.set({
      lastMessage: text,
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
      unreadByAdmin: firebase.firestore.FieldValue.increment(1),
      customerTyping: false
    }, { merge: true });
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  // যদি আগেই চ্যাট চলমান থাকে (পেজ রিলোড), সরাসরি চ্যাট উইন্ডো দেখাও
  chatRef.get().then(doc => {
    if (doc.exists && doc.data().customerName) {
      startChat(doc.data().customerName);
    }
  });
</script>
</body>
</html>
