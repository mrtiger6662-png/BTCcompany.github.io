<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Deposit Requests</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, sans-serif; background:#0b0e11; color:#eaecef; padding-bottom:40px; }
  header { padding:16px 20px; text-align:center; }
  header h1 { font-size:18px; margin:0; color:#f0b90b; }
  #access-denied { text-align:center; padding:40px 20px; color:#f6465d; }
  .list { padding:0 16px; }
  .req-card { background:#161a1e; border-radius:12px; padding:16px; margin-bottom:14px; }
  .req-top { display:flex; justify-content:space-between; font-size:13px; color:#848e9c; margin-bottom:8px; }
  .req-amount { font-size:18px; font-weight:bold; color:#f0b90b; margin-bottom:10px; }
  .req-card img.proof { width:100%; max-height:260px; object-fit:contain; border-radius:8px; background:#000; margin-bottom:12px; cursor:pointer; }
  .credit-row { display:flex; gap:8px; margin-bottom:10px; }
  .credit-row input {
    flex:1; background:#1e2329; border:1px solid #2b3139; color:#eaecef;
    padding:10px; border-radius:8px; font-size:14px;
  }
  .action-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .accept-btn, .reject-btn { padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; border:none; }
  .accept-btn { background:#0ecb81; color:#0b0e11; }
  .reject-btn { background:#f6465d; color:#fff; }
  .status-tag { font-size:12px; font-weight:bold; padding:3px 8px; border-radius:6px; }
  .status-tag.approved { background:rgba(14,203,129,0.15); color:#0ecb81; }
  .status-tag.rejected { background:rgba(246,70,93,0.15); color:#f6465d; }
  .empty-msg { text-align:center; color:#848e9c; padding:30px; }
</style>
</head>
<body>

<header><h1>Deposit Requests (Admin)</h1></header>

<div id="access-denied" style="display:none;">You do not have access to this page.</div>
<div class="list" id="req-list"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDJoPr8RvE1xkNTKRr5kwTx6E51GCMn_HE",
  authDomain: "abc-company-6272a.firebaseapp.com",
  projectId: "abc-company-6272a",
  storageBucket: "abc-company-6272a.firebasestorage.app",
  messagingSenderId: "1026212780106",
  appId: "1:1026212780106:web:985ec1bc35837d6320eeb3"
};
firebase.initializeApp(firebaseConfig);

const ADMIN_EMAIL = 'mrtiger6662@gmail.com';

firebase.auth().onAuthStateChanged(user => {
  if (!user) { window.location.href = 'login.html'; return; }
  if (user.email !== ADMIN_EMAIL) {
    document.getElementById('access-denied').style.display = 'block';
    return;
  }
  loadDeposits();
});

async function loadDeposits() {
  const listEl = document.getElementById('req-list');
  listEl.innerHTML = '<p class="empty-msg">Loading...</p>';

  const snapshot = await firebase.firestore().collection('deposits')
    .orderBy('createdAt', 'desc').get();

  if (snapshot.empty) {
    listEl.innerHTML = '<p class="empty-msg">No deposit requests yet.</p>';
    return;
  }

  listEl.innerHTML = '';
  snapshot.forEach(doc => {
    const d = doc.data();
    const card = document.createElement('div');
    card.className = 'req-card';

    let actionsHtml = '';
    if (d.status === 'pending') {
      actionsHtml = `
        <div class="credit-row">
          <input type="number" placeholder="USDT to credit" id="credit-${doc.id}">
        </div>
        <div class="action-row">
          <button class="accept-btn" data-id="${doc.id}" data-uid="${d.uid}">Accept</button>
          <button class="reject-btn" data-id="${doc.id}">Reject</button>
        </div>`;
    } else {
      const cls = d.status === 'approved' ? 'approved' : 'rejected';
      const extra = d.status === 'approved' ? ` (+${d.creditedUSDT} USDT)` : '';
      actionsHtml = `<span class="status-tag ${cls}">${d.status.toUpperCase()}${extra}</span>`;
    }

    card.innerHTML = `
      <div class="req-top">
        <span>${d.userEmail || d.uid}</span>
        <span>${d.createdAt ? d.createdAt.toDate().toLocaleString() : ''}</span>
      </div>
      <div class="req-amount">${d.claimedAmount} ${d.symbol}</div>
      <img class="proof" src="${d.proofUrl}" onclick="window.open('${d.proofUrl}','_blank')">
      ${actionsHtml}
    `;
    listEl.appendChild(card);
  });

  document.querySelectorAll('.accept-btn').forEach(btn => {
    btn.addEventListener('click', () => acceptDeposit(btn.dataset.id, btn.dataset.uid));
  });
  document.querySelectorAll('.reject-btn').forEach(btn => {
    btn.addEventListener('click', () => rejectDeposit(btn.dataset.id));
  });
}

async function acceptDeposit(depositId, uid) {
  const input = document.getElementById('credit-' + depositId);
  const creditVal = parseFloat(input.value);
  if (isNaN(creditVal) || creditVal <= 0) {
    alert('Please enter a valid USDT amount to credit.');
    return;
  }

  await firebase.firestore().collection('deposits').doc(depositId).update({
    status: 'approved',
    creditedUSDT: creditVal
  });

  await firebase.firestore().collection('users').doc(uid).set({
    balance: firebase.firestore.FieldValue.increment(creditVal)
  }, { merge: true });

  loadDeposits();
}

async function rejectDeposit(depositId) {
  await firebase.firestore().collection('deposits').doc(depositId).update({
    status: 'rejected'
  });
  loadDeposits();
}
</script>
</body>
</html>
