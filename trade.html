<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade ABC Company</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, sans-serif; background:#0b0e11; color:#eaecef; padding-bottom:70px; }
  header { display:flex; align-items:center; justify-content:center; padding:16px 20px; position:relative; }
  header h1 { font-size:20px; margin:0; color:#f0b90b; }
  .back-btn {
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:#eaecef; font-size:20px; cursor:pointer;
  }
  #coin-list-view .coin-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid #1e2329; cursor:pointer;
  }
  #coin-list-view .coin-row:active { background:#1e2329; }
  .coin-left { display:flex; align-items:center; gap:10px; }
  .coin-left img { width:28px; height:28px; border-radius:50%; }
  .coin-name { font-weight:bold; }
  .coin-sub { color:#848e9c; font-size:12px; }
  .coin-right { text-align:right; }
  .coin-price { font-weight:bold; }
  .change-up { color:#0ecb81; }
  .change-down { color:#f6465d; }

  #chart-view { display:none; padding:16px; }

  .demo-banner {
    background:rgba(240,185,11,0.12); border:1px solid #f0b90b; color:#f0b90b;
    padding:10px 14px; border-radius:8px; text-align:center; font-weight:bold;
    font-size:13px; margin-bottom:12px;
  }
  .demo-banner span { display:block; font-weight:normal; font-size:11px; color:#c9a13a; margin-top:2px; }

  .balance-row {
    display:flex; align-items:center; justify-content:space-between;
    background:#161a1e; border-radius:8px; padding:10px 14px; margin-bottom:12px;
  }
  .balance-row .label { color:#848e9c; font-size:12px; }
  .balance-row .value { font-weight:bold; font-size:16px; color:#f0b90b; }
  .reset-btn {
    background:transparent; border:1px solid #474d57; color:#848e9c;
    padding:5px 10px; border-radius:6px; font-size:11px; cursor:pointer;
  }

  .chart-header { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .chart-header img { width:26px; height:26px; border-radius:50%; }
  .chart-header .pair-name { font-weight:bold; font-size:18px; }
  .chart-card { background:#161a1e; border-radius:12px; padding:16px; }
  .price-row { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
  .price-row .big-price { font-size:22px; font-weight:bold; }
  .ohlc-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 20px; margin-bottom:14px; font-size:13px; color:#848e9c; }
  .ohlc-grid span.val { color:#eaecef; font-weight:bold; }
  .interval-select {
    background:#1e2329; color:#eaecef; border:1px solid #2b3139; border-radius:6px;
    padding:6px 10px; margin-left:auto; cursor:pointer;
  }
  canvas#candles { width:100%; height:260px; display:block; }
  canvas#volume { width:100%; height:60px; display:block; margin-top:4px; }
  .time-labels { display:flex; justify-content:space-between; font-size:11px; color:#848e9c; margin-top:4px; }

  .duration-row { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:16px; }
  .duration-box {
    background:#1e2329; border:1px solid #2b3139; border-radius:8px;
    padding:12px 4px; text-align:center; cursor:pointer; transition:0.15s;
  }
  .duration-box:active { transform:scale(0.97); }
  .duration-box.selected { border-color:#f0b90b; background:rgba(240,185,11,0.1); }
  .duration-time { font-size:17px; font-weight:bold; color:#f0b90b; }
  .duration-return { font-size:10px; color:#848e9c; margin-top:4px; line-height:1.3; }

  .invest-section { margin-top:18px; display:none; }
  .amount-box { display:flex; align-items:center; gap:8px; }
  .amount-box input {
    flex:1; text-align:center; font-size:18px; font-weight:bold;
    background:#1e2329; border:1px solid #2b3139; color:#eaecef;
    padding:12px; border-radius:8px;
  }
  .amount-box input::placeholder { color:#5b6169; font-weight:normal; font-size:14px; }
  .amt-btn {
    width:44px; height:44px; border-radius:8px; border:1px solid #2b3139;
    background:#1e2329; color:#eaecef; font-size:20px; cursor:pointer; flex-shrink:0;
  }
  .amt-btn:active { background:#2b3139; }
  .amount-range { text-align:center; font-size:12px; color:#848e9c; margin-top:6px; }
  .amount-error { text-align:center; font-size:12px; color:#f6465d; margin-top:4px; min-height:14px; }

  .direction-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .down-btn, .up-btn {
    padding:14px; border-radius:8px; font-weight:bold; font-size:15px; cursor:pointer;
  }
  .down-btn { background:rgba(246,70,93,0.12); border:1px solid #f6465d; color:#f6465d; }
  .up-btn { background:rgba(14,203,129,0.12); border:1px solid #0ecb81; color:#0ecb81; }
  .down-btn:disabled, .up-btn:disabled { opacity:0.4; cursor:not-allowed; }

  .trade-status {
    margin-top:14px; text-align:center; font-size:13px; padding:10px;
    border-radius:8px; display:none;
  }
  .trade-status.pending { display:block; background:rgba(240,185,11,0.1); color:#f0b90b; }
  .trade-status.win { display:block; background:rgba(14,203,129,0.12); color:#0ecb81; }
  .trade-status.lose { display:block; background:rgba(246,70,93,0.12); color:#f6465d; }

  .bottom-nav {
    position:fixed; bottom:0; left:0; right:0; background:#161a1e;
    display:flex; justify-content:space-around; padding:10px 0;
    border-top:1px solid #2b3139;
  }
  .bottom-nav a { text-decoration:none; }
  .bottom-nav div { text-align:center; color:#848e9c; font-size:11px; cursor:pointer; }
  .bottom-nav div.active { color:#f0b90b; }
  .bottom-nav .ic {
    font-size:18px; width:38px; height:38px; line-height:38px;
    margin:0 auto 2px; border-radius:50%; transition:0.2s;
  }
  .bottom-nav div.active .ic {
    background:rgba(240,185,11,0.15);
    box-shadow:0 0 0 6px rgba(240,185,11,0.08);
  }
</style>
</head>
<body>

<header>
  <button class="back-btn" id="back-btn" style="display:none;">&#8592;</button>
  <h1 id="page-title">Smart Trading (Demo)</h1>
</header>

<div id="coin-list-view"></div>

<div id="chart-view">

  <div class="balance-row">
    <div>
      <div class="label">Demo Balance (Virtual)</div>
      <div class="value" id="balance-display">$0.00</div>
    </div>
    <button class="reset-btn" id="reset-balance-btn">Reset Balance</button>
  </div>

  <div class="chart-header">
    <img id="chart-icon" src="" alt="">
    <span class="pair-name" id="chart-pair"></span>
    <select class="interval-select" id="interval-select">
      <option value="1m">1min</option>
      <option value="5m">5min</option>
      <option value="15min" selected>15min</option>
      <option value="1h">1hour</option>
      <option value="4h">4hour</option>
      <option value="1d">1day</option>
    </select>
  </div>
  <div class="chart-card">
    <div class="price-row">
      <div class="big-price" id="live-price">-</div>
      <div id="live-change">-</div>
    </div>
    <div class="ohlc-grid">
      <div>Open: <span class="val" id="ohlc-open">-</span></div>
      <div>High: <span class="val" id="ohlc-high">-</span></div>
      <div>Low: <span class="val" id="ohlc-low">-</span></div>
      <div>Close: <span class="val" id="ohlc-close">-</span></div>
    </div>
    <canvas id="candles" width="700" height="260"></canvas>
    <canvas id="volume" width="700" height="60"></canvas>
    <div class="time-labels" id="time-labels"></div>

    <div class="duration-row" id="duration-row"></div>

    <div class="invest-section" id="invest-section">
      <div class="amount-box">
        <button class="amt-btn" id="amt-minus">&#8722;</button>
        <input type="number" id="amount-input" placeholder="Investment amount (Virtual $)">
        <button class="amt-btn" id="amt-plus">+</button>
      </div>
      <div class="amount-range" id="amount-range">Amount range: -</div>
      <div class="amount-error" id="amount-error"></div>

      <div class="direction-row">
        <button class="down-btn" id="down-btn">Down</button>
        <button class="up-btn" id="up-btn">UP</button>
      </div>

      <div class="trade-status" id="trade-status"></div>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <a href="market.html"><div><div class="ic">&#128200;</div>Market</div></a>
  <div class="active"><div class="ic">&#128179;</div>Trade</div>
  <a href="assets.html"><div><div class="ic">&#128188;</div>Assets</div></a>
  <a href="profile.html"><div><div class="ic">&#128100;</div>Profile</div></a>
</div>

<script>
const coinList = [
  { symbol: 'BTCUSDT', name: 'Bitcoin', short: 'BTC', icon: 'btc' },
  { symbol: 'ETHUSDT', name: 'Ethereum', short: 'ETH', icon: 'eth' },
  { symbol: 'BNBUSDT', name: 'BNB', short: 'BNB', icon: 'bnb' },
  { symbol: 'SOLUSDT', name: 'Solana', short: 'SOL', icon: 'sol' },
  { symbol: 'XRPUSDT', name: 'XRP', short: 'XRP', icon: 'xrp' },
  { symbol: 'ADAUSDT', name: 'Cardano', short: 'ADA', icon: 'ada' },
  { symbol: 'DOGEUSDT', name: 'Dogecoin', short: 'DOGE', icon: 'doge' },
  { symbol: 'TRXUSDT', name: 'TRON', short: 'TRX', icon: 'trx' },
  { symbol: 'TONUSDT', name: 'Toncoin', short: 'TON', icon: 'ton' },
  { symbol: 'DOTUSDT', name: 'Polkadot', short: 'DOT', icon: 'dot' },
  { symbol: 'POLUSDT', name: 'Polygon', short: 'POL', icon: 'matic' },
  { symbol: 'LTCUSDT', name: 'Litecoin', short: 'LTC', icon: 'ltc' },
  { symbol: 'SHIBUSDT', name: 'Shiba Inu', short: 'SHIB', icon: 'shib' },
  { symbol: 'AVAXUSDT', name: 'Avalanche', short: 'AVAX', icon: 'avax' },
  { symbol: 'LINKUSDT', name: 'Chainlink', short: 'LINK', icon: 'link' },
  { symbol: 'ATOMUSDT', name: 'Cosmos', short: 'ATOM', icon: 'atom' },
  { symbol: 'UNIUSDT', name: 'Uniswap', short: 'UNI', icon: 'uni' },
  { symbol: 'XLMUSDT', name: 'Stellar', short: 'XLM', icon: 'xlm' },
  { symbol: 'NEARUSDT', name: 'NEAR Protocol', short: 'NEAR', icon: 'near' },
  { symbol: 'APTUSDT', name: 'Aptos', short: 'APT', icon: 'apt' },
  { symbol: 'ARBUSDT', name: 'Arbitrum', short: 'ARB', icon: 'arb' },
  { symbol: 'OPUSDT', name: 'Optimism', short: 'OP', icon: 'op' },
  { symbol: 'FILUSDT', name: 'Filecoin', short: 'FIL', icon: 'fil' },
  { symbol: 'ICPUSDT', name: 'Internet Computer', short: 'ICP', icon: 'icp' },
  { symbol: 'BCHUSDT', name: 'Bitcoin Cash', short: 'BCH', icon: 'bch' },
  { symbol: 'ALGOUSDT', name: 'Algorand', short: 'ALGO', icon: 'algo' },
  { symbol: 'VETUSDT', name: 'VeChain', short: 'VET', icon: 'vet' },
  { symbol: 'SANDUSDT', name: 'The Sandbox', short: 'SAND', icon: 'sand' },
  { symbol: 'MANAUSDT', name: 'Decentraland', short: 'MANA', icon: 'mana' },
  { symbol: 'HBARUSDT', name: 'Hedera', short: 'HBAR', icon: 'hbar' }
];

// Duration options with their virtual-amount ranges and step sizes
const durationList = [
  { seconds: 60,  returnPct: 20.00, min: 100,    max: 9999,     step: 100   },
  { seconds: 120, returnPct: 25.00, min: 10000,  max: 49999,    step: 1000  },
  { seconds: 180, returnPct: 30.00, min: 50000,  max: 99999,    step: 1000  },
  { seconds: 300, returnPct: 50.00, min: 100000, max: 5000000,  step: 10000 },
  { seconds: 600, returnPct: 85.00, min: 100000, max: Infinity, step: 10000 }
];

let selectedDuration = null;

// ---------- Demo balance (virtual, stored locally in this browser only) ----------
const BALANCE_KEY = 'demoBalance_v1';
function getBalance() {
  const v = localStorage.getItem(BALANCE_KEY);
  return v === null ? 10000 : parseFloat(v);
}
function setBalance(val) {
  localStorage.setItem(BALANCE_KEY, val.toFixed(2));
  renderBalance();
}
function renderBalance() {
  document.getElementById('balance-display').textContent =
    '$' + getBalance().toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' (Virtual)';
}
document.getElementById('reset-balance-btn').addEventListener('click', () => {
  setBalance(10000);
});

// ---------- Duration boxes ----------
function renderDurationBoxes() {
  const row = document.getElementById('duration-row');
  row.innerHTML = '';
  durationList.forEach(d => {
    const box = document.createElement('div');
    box.className = 'duration-box';
    box.innerHTML = `<div class="duration-time">${d.seconds}s</div><div class="duration-return">${d.returnPct.toFixed(2)}% return</div>`;
    box.addEventListener('click', () => {
      document.querySelectorAll('.duration-box').forEach(b => b.classList.remove('selected'));
      box.classList.add('selected');
      selectedDuration = d;
      showInvestSection(d);
    });
    row.appendChild(box);
  });
}

function showInvestSection(d) {
  const section = document.getElementById('invest-section');
  const rangeText = document.getElementById('amount-range');
  const input = document.getElementById('amount-input');
  const errorEl = document.getElementById('amount-error');

  section.style.display = 'block';
  errorEl.textContent = '';
  input.value = '';
  input.placeholder = 'Investment amount (Virtual $)';

  if (d.max === Infinity) {
    rangeText.textContent = `Amount range: ${d.min.toLocaleString()}+ (কোনো ঊর্ধ্বসীমা নেই)`;
  } else {
    rangeText.textContent = `Amount range: ${d.min.toLocaleString()} - ${d.max.toLocaleString()}`;
  }
}

document.getElementById('amt-minus').addEventListener('click', () => adjustAmount(-1));
document.getElementById('amt-plus').addEventListener('click', () => adjustAmount(1));

function adjustAmount(dir) {
  if (!selectedDuration) return;
  const input = document.getElementById('amount-input');
  let current = parseFloat(input.value);
  if (isNaN(current)) current = selectedDuration.min;
  current += dir * selectedDuration.step;
  if (current < selectedDuration.min) current = selectedDuration.min;
  if (selectedDuration.max !== Infinity && current > selectedDuration.max) current = selectedDuration.max;
  input.value = current;
}

function validateAmount() {
  const errorEl = document.getElementById('amount-error');
  errorEl.textContent = '';
  if (!selectedDuration) {
    errorEl.textContent = 'আগে একটি সময়সীমা (Duration) বাছাই করুন।';
    return null;
  }
  const input = document.getElementById('amount-input');
  const val = parseFloat(input.value);
  if (isNaN(val) || val <= 0) {
    errorEl.textContent = 'একটি সংখ্যা লিখুন।';
    return null;
  }
  if (val < selectedDuration.min || (selectedDuration.max !== Infinity && val > selectedDuration.max)) {
    errorEl.textContent = `পরিমাণ অবশ্যই ${selectedDuration.min.toLocaleString()}${selectedDuration.max !== Infinity ? ' - ' + selectedDuration.max.toLocaleString() : '+'} এর মধ্যে হতে হবে।`;
    return null;
  }
  if (val > getBalance()) {
    errorEl.textContent = 'আপনার Demo Balance পর্যাপ্ত নয়।';
    return null;
  }
  return val;
}

// ---------- Coin list / chart view switching ----------
const listView = document.getElementById('coin-list-view');
const chartView = document.getElementById('chart-view');
const backBtn = document.getElementById('back-btn');
const pageTitle = document.getElementById('page-title');
const intervalSelect = document.getElementById('interval-select');

let currentSymbol = null;
let refreshTimer = null;
let tradeInProgress = false;

function iconUrl(icon) {
  return 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color/' + icon + '.png';
}

async function loadCoinList() {
  listView.innerHTML = '<p style="text-align:center;color:#848e9c;padding:20px;">Loading...</p>';
  try {
    const symbolsParam = encodeURIComponent(JSON.stringify(coinList.map(c => c.symbol)));
    const res = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols=' + symbolsParam);
    const tickers = await res.json();
    listView.innerHTML = '';

    coinList.forEach(coin => {
      const t = tickers.find(x => x.symbol === coin.symbol);
      if (!t) return;
      const changePercent = parseFloat(t.priceChangePercent);
      const up = changePercent >= 0;
      const price = parseFloat(t.lastPrice);

      const row = document.createElement('div');
      row.className = 'coin-row';
      row.innerHTML = `
        <div class="coin-left">
          <img src="${iconUrl(coin.icon)}" onerror="this.style.visibility='hidden'">
          <div>
            <div class="coin-name">${coin.short}/USDT</div>
            <div class="coin-sub">${coin.name}</div>
          </div>
        </div>
        <div class="coin-right">
          <div class="coin-price">$${price.toLocaleString(undefined,{maximumFractionDigits:4})}</div>
          <div class="${up?'change-up':'change-down'}">${up?'+':''}${changePercent.toFixed(2)}%</div>
        </div>`;
      row.addEventListener('click', () => openChart(coin));
      listView.appendChild(row);
    });
  } catch (err) {
    listView.innerHTML = '<p style="text-align:center;color:#f6465d;padding:20px;">Could not load coin list.</p>';
  }
}

function openChart(coin) {
  currentSymbol = coin;
  listView.style.display = 'none';
  chartView.style.display = 'block';
  backBtn.style.display = 'block';
  pageTitle.textContent = coin.short + '/USDT (Demo)';
  document.getElementById('chart-icon').src = iconUrl(coin.icon);
  document.getElementById('chart-pair').textContent = coin.short + '/USDT';

  renderBalance();
  renderDurationBoxes();
  document.getElementById('invest-section').style.display = 'none';
  selectedDuration = null;

  loadChart();
  clearInterval(refreshTimer);
  refreshTimer = setInterval(loadChart, 15000);
}

backBtn.addEventListener('click', () => {
  clearInterval(refreshTimer);
  chartView.style.display = 'none';
  listView.style.display = 'block';
  backBtn.style.display = 'none';
  pageTitle.textContent = 'Smart Trading (Demo)';
});

intervalSelect.addEventListener('change', () => {
  if (currentSymbol) loadChart();
});

function drawCandles(canvas, klines) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);

  const highs = klines.map(k => parseFloat(k[2]));
  const lows = klines.map(k => parseFloat(k[3]));
  const max = Math.max(...highs);
  const min = Math.min(...lows);
  const range = (max - min) || 1;
  const candleWidth = w / klines.length;

  klines.forEach((k, i) => {
    const open = parseFloat(k[1]);
    const high = parseFloat(k[2]);
    const low = parseFloat(k[3]);
    const close = parseFloat(k[4]);
    const up = close >= open;
    const color = up ? '#0ecb81' : '#f6465d';
    const x = i * candleWidth + candleWidth/2;

    const yHigh = h - ((high - min)/range) * h;
    const yLow = h - ((low - min)/range) * h;
    const yOpen = h - ((open - min)/range) * h;
    const yClose = h - ((close - min)/range) * h;

    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, yHigh);
    ctx.lineTo(x, yLow);
    ctx.stroke();

    ctx.fillStyle = color;
    const bodyTop = Math.min(yOpen, yClose);
    const bodyHeight = Math.max(Math.abs(yClose - yOpen), 1);
    ctx.fillRect(x - candleWidth*0.35, bodyTop, candleWidth*0.7, bodyHeight);
  });
}

function drawVolume(canvas, klines) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  const volumes = klines.map(k => parseFloat(k[5]));
  const maxVol = Math.max(...volumes) || 1;
  const barWidth = w / klines.length;

  klines.forEach((k, i) => {
    const open = parseFloat(k[1]);
    const close = parseFloat(k[4]);
    const up = close >= open;
    const vol = parseFloat(k[5]);
    const barHeight = (vol / maxVol) * h;
    const x = i * barWidth;
    ctx.fillStyle = up ? 'rgba(14,203,129,0.6)' : 'rgba(246,70,93,0.6)';
    ctx.fillRect(x + barWidth*0.15, h - barHeight, barWidth*0.7, barHeight);
  });
}

async function loadChart() {
  if (!currentSymbol) return;
  try {
    const interval = intervalSelect.value;
    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${currentSymbol.symbol}&interval=${interval}&limit=48`);
    const klines = await res.json();
    if (!klines || klines.length === 0) return;

    drawCandles(document.getElementById('candles'), klines);
    drawVolume(document.getElementById('volume'), klines);

    const last = klines[klines.length - 1];
    const first = klines[0];
    const openVal = parseFloat(last[1]);
    const highVal = parseFloat(last[2]);
    const lowVal = parseFloat(last[3]);
    const closeVal = parseFloat(last[4]);
    const prevClose = parseFloat(klines[klines.length - 2] ? klines[klines.length - 2][4] : first[1]);
    const changePercent = ((closeVal - prevClose) / prevClose) * 100;
    const up = changePercent >= 0;

    document.getElementById('live-price').textContent = closeVal.toLocaleString(undefined,{maximumFractionDigits:4}) + ' USD';
    const changeEl = document.getElementById('live-change');
    changeEl.textContent = (up?'+':'') + changePercent.toFixed(2) + '%';
    changeEl.className = up ? 'change-up' : 'change-down';
    document.getElementById('ohlc-open').textContent = openVal.toLocaleString(undefined,{maximumFractionDigits:2});
    document.getElementById('ohlc-high').textContent = highVal.toLocaleString(undefined,{maximumFractionDigits:2});
    document.getElementById('ohlc-low').textContent = lowVal.toLocaleString(undefined,{maximumFractionDigits:2});
    document.getElementById('ohlc-close').textContent = closeVal.toLocaleString(undefined,{maximumFractionDigits:2});

    const startTime = new Date(first[0]);
    const endTime = new Date(last[0]);
    document.getElementById('time-labels').innerHTML =
      `<span>${startTime.toLocaleString()}</span><span>${endTime.toLocaleString()}</span>`;
  } catch (err) {
    console.error(err);
  }
}

// ---------- Demo trade execution (resolved by real live price movement) ----------
async function fetchLivePrice(symbol) {
  const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
  const data = await res.json();
  return parseFloat(data.price);
}

async function placeTrade(direction) {
  if (tradeInProgress) return;
  const amount = validateAmount();
  if (amount === null) return;

  const statusEl = document.getElementById('trade-status');
  const upBtn = document.getElementById('up-btn');
  const downBtn = document.getElementById('down-btn');
  const amountInput = document.getElementById('amount-input');
  const duration = selectedDuration;

  tradeInProgress = true;
  upBtn.disabled = true;
  downBtn.disabled = true;
  amountInput.disabled = true;

  // Deduct the virtual stake immediately
  setBalance(getBalance() - amount);

  let entryPrice;
  try {
    entryPrice = await fetchLivePrice(currentSymbol.symbol);
  } catch (err) {
    statusEl.className = 'trade-status lose';
    statusEl.textContent = 'দাম আনতে সমস্যা হয়েছে, ট্রেড বাতিল করা হয়েছে।';
    setBalance(getBalance() + amount); // refund
    resetTradeButtons();
    return;
  }

  let remaining = duration.seconds;
  statusEl.className = 'trade-status pending';
  statusEl.textContent = `Position খোলা হয়েছে: ${direction.toUpperCase()} | Entry: ${entryPrice} | বাকি সময়: ${remaining}s`;

  const countdownTimer = setInterval(() => {
    remaining -= 1;
    if (remaining >= 0) {
      statusEl.textContent = `Position খোলা হয়েছে: ${direction.toUpperCase()} | Entry: ${entryPrice} | বাকি সময়: ${remaining}s`;
    }
  }, 1000);

  setTimeout(async () => {
    clearInterval(countdownTimer);
    let exitPrice;
    try {
      exitPrice = await fetchLivePrice(currentSymbol.symbol);
    } catch (err) {
      statusEl.className = 'trade-status lose';
      statusEl.textContent = 'দাম যাচাই করতে সমস্যা হয়েছে, স্টেক ফেরত দেওয়া হলো।';
      setBalance(getBalance() + amount);
      resetTradeButtons();
      return;
    }

    const wentUp = exitPrice > entryPrice;
    const wentDown = exitPrice < entryPrice;
    const won = (direction === 'up' && wentUp) || (direction === 'down' && wentDown);
    const tie = exitPrice === entryPrice;

    if (tie) {
      setBalance(getBalance() + amount);
      statusEl.className = 'trade-status pending';
      statusEl.textContent = `দাম অপরিবর্তিত (Entry: ${entryPrice} → Exit: ${exitPrice})। স্টেক ফেরত দেওয়া হলো।`;
    } else if (won) {
      const profit = amount * (duration.returnPct / 100);
      const payout = amount + profit;
      setBalance(getBalance() + payout);
      statusEl.className = 'trade-status win';
      statusEl.textContent = `✅ জিতেছেন! Entry: ${entryPrice} → Exit: ${exitPrice}। লাভ: +$${profit.toFixed(2)} (Virtual)`;
    } else {
      statusEl.className = 'trade-status lose';
      statusEl.textContent = `❌ হেরেছেন। Entry: ${entryPrice} → Exit: ${exitPrice}। স্টেক হারিয়েছেন: -$${amount.toFixed(2)} (Virtual)`;
    }

    resetTradeButtons();
  }, duration.seconds * 1000);
}

function resetTradeButtons() {
  tradeInProgress = false;
  document.getElementById('up-btn').disabled = false;
  document.getElementById('down-btn').disabled = false;
  document.getElementById('amount-input').disabled = false;
}

document.getElementById('up-btn').addEventListener('click', () => placeTrade('up'));
document.getElementById('down-btn').addEventListener('click', () => placeTrade('down'));

renderBalance();
loadCoinList();
</script>
</body>
</html>
