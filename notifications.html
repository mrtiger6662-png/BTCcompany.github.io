<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity</title>
<style>
  :root{
    --bg: #0a0a0d;
    --surface: #14141a;
    --surface-2: #1c1c24;
    --border: #262631;
    --text: #f2f2f5;
    --text-dim: #8b8b98;
    --text-faint: #55555f;
    --green: #16c784;
    --green-bg: rgba(22,199,132,0.12);
    --red: #ea3943;
    --red-bg: rgba(234,57,67,0.12);
    --gold: #f0b90b;
    --gold-bg: rgba(240,185,11,0.12);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Bengali", Roboto, sans-serif;
    min-height:100vh;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }

  /* Header */
  .header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px 16px 14px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  .back-btn{
    width:34px; height:34px;
    border-radius:10px;
    background:var(--surface);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text);
    cursor:pointer;
    flex-shrink:0;
  }
  .back-btn:hover{ background:var(--surface-2); }
  .header h1{
    font-size:19px;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }

  /* Tabs */
  .tabs{
    display:flex;
    gap:6px;
    padding:4px 16px 16px;
  }
  .tab{
    padding:8px 16px;
    border-radius:20px;
    font-size:13.5px;
    font-weight:500;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#171313;
  }

  .content{
    flex:1;
    padding:0 16px 32px;
    overflow-y:auto;
  }

  .section-label{
    font-size:13px;
    color:var(--text-dim);
    padding:18px 2px 10px;
    font-weight:500;
  }
  .section-label:first-child{ padding-top:6px; }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
  }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 16px;
  }
  .row + .row{
    border-top:1px solid var(--border);
  }

  .row-left{
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:0;
  }
  .row-title{
    font-size:14.5px;
    font-weight:600;
    color:var(--text);
  }
  .row-sub{
    font-size:12px;
    color:var(--text-faint);
  }
  .row-sub .ref{
    color:var(--text-faint);
  }

  .row-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
    flex-shrink:0;
  }

  .pill{
    font-size:13px;
    font-weight:700;
    padding:4px 10px;
    border-radius:8px;
    white-space:nowrap;
  }
  .pill.pos{ color:var(--green); background:var(--green-bg); }
  .pill.neg{ color:var(--red); background:var(--red-bg); }

  .status{
    font-size:11.5px;
    font-weight:500;
    padding:2px 8px;
    border-radius:8px;
    display:inline-block;
  }
  .status.completed{ color:var(--text-dim); background:transparent; padding:0; }
  .status.success{ color:var(--green); background:var(--green-bg); }
  .status.pending{ color:var(--gold); background:var(--gold-bg); }
  .status.rejected{ color:var(--red); background:var(--red-bg); }
  .status.error{ color:var(--red); background:var(--red-bg); }

  .amount{
    font-size:14.5px;
    font-weight:700;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--text-faint);
    font-size:13.5px;
  }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <button class="back-btn" aria-label="Back" onclick="window.history.back()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1>Activity</h1>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="all">All</button>
    <button class="tab" data-tab="trades">Trades</button>
    <button class="tab" data-tab="deposit">Deposit</button>
    <button class="tab" data-tab="withdraw">Withdraw</button>
  </div>

  <div class="content" id="content">
    <div class="empty">Loading...</div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDJoPr8RvE1xkNTKRr5kwTx6E51GCMn_HE",
  authDomain: "abc-company-6272a.firebaseapp.com",
  projectId: "abc-company-6272a",
  storageBucket: "abc-company-6272a.firebasestorage.app",
  messagingSenderId: "1026212780106",
  appId: "1:1026212780106:web:985ec1bc35837d6320eeb3"
};
firebase.initializeApp(firebaseConfig);

let trades = [];
let deposits = [];
let withdrawals = [];
let currentTab = 'all';

// ---- Helpers (mirrors assets.html) ----
function formatDate(ts) {
  if (!ts || !ts.toDate) return '—';
  const d = ts.toDate();
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) +
    ', ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

// Returns a sortable millisecond value from a Firestore Timestamp
function sortTime(ts) {
  if (!ts || !ts.toDate) return 0;
  return ts.toDate().getTime();
}

function fmtSigned(n){
  const sign = n >= 0 ? "+" : "-";
  return `${sign}${Math.abs(n).toFixed(2)} USDT`;
}

function tradeStatusLabel(status) {
  if (status === 'completed') return 'Completed';
  if (status === 'pending') return 'Pending';
  if (status === 'error') return 'Error';
  return status;
}

function depositWithdrawStatus(status) {
  if (status === 'approved') return { text: 'Success', cls: 'success' };
  if (status === 'rejected') return { text: 'Rejected', cls: 'rejected' };
  return { text: 'Pending', cls: 'pending' };
}

// ---- Row renderers ----
function tradeRow(t){
  const pending = t.status !== 'completed';
  const positive = t.profit >= 0;
  return `
    <div class="row">
      <div class="row-left">
        <div class="row-title">${t.symbol}</div>
        <div class="row-sub">${t.date}</div>
        <div class="row-sub ref">Ref: ${t.serial}</div>
      </div>
      <div class="row-right">
        ${pending
          ? `<span class="status ${t.status}">${tradeStatusLabel(t.status)}</span>`
          : `<span class="pill ${positive ? "pos" : "neg"}">${fmtSigned(t.profit)}</span><span class="status completed">${tradeStatusLabel(t.status)}</span>`
        }
      </div>
    </div>`;
}

function depositRow(d){
  const badge = depositWithdrawStatus(d.status);
  return `
    <div class="row">
      <div class="row-left">
        <div class="row-title">Deposit</div>
        <div class="row-sub">${d.date}</div>
        <div class="row-sub ref">Ref: ${d.serial}</div>
      </div>
      <div class="row-right">
        <span class="amount">${d.amount.toFixed(2)} USDT</span>
        <span class="status ${badge.cls}">${badge.text}</span>
      </div>
    </div>`;
}

function withdrawRow(w){
  const badge = depositWithdrawStatus(w.status);
  return `
    <div class="row">
      <div class="row-left">
        <div class="row-title">Withdrawal</div>
        <div class="row-sub">${w.date}</div>
        <div class="row-sub ref">Ref: ${w.serial}</div>
      </div>
      <div class="row-right">
        <span class="amount">-${w.amount.toFixed(2)} USDT</span>
        <span class="status ${badge.cls}">${badge.text}</span>
      </div>
    </div>`;
}

function renderSection(label, rowsHtml){
  if(!rowsHtml){
    return `<div class="section-label">${label}</div><div class="card"><div class="empty">No activity yet</div></div>`;
  }
  return `<div class="section-label">${label}</div><div class="card">${rowsHtml}</div>`;
}

function render(tab){
  currentTab = tab;
  const el = document.getElementById("content");
  let html = "";

  if(tab === "all" || tab === "trades"){
    html += renderSection("Recent Trades", trades.map(tradeRow).join(""));
  }
  if(tab === "all" || tab === "deposit"){
    html += renderSection("Deposit", deposits.map(depositRow).join(""));
  }
  if(tab === "all" || tab === "withdraw"){
    html += renderSection("Withdraw", withdrawals.map(withdrawRow).join(""));
  }

  el.innerHTML = html;
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    render(btn.dataset.tab);
  });
});

// ---- Auth + live Firestore data (same collections/fields as assets.html) ----
firebase.auth().onAuthStateChanged(user => {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }

  const db = firebase.firestore();

  db.collection('trades')
    .where('uid', '==', user.uid)
    .onSnapshot(snap => {
      trades = snap.docs.map(d => {
        const data = d.data();
        let profit = 0;
        if (data.result === 'win') profit = data.expectedReturn || 0;
        else if (data.result === 'lose') profit = -(data.amount || 0);
        return {
          symbol: data.symbol || '—',
          profit: profit,
          status: data.status || 'pending',
          date: formatDate(data.createdAt),
          _t: sortTime(data.createdAt),
          serial: data.orderNumber || d.id
        };
      }).sort((a, b) => b._t - a._t);
      render(currentTab);
    }, () => {
      document.getElementById('content').innerHTML = `<div class="empty">Failed to load activity</div>`;
    });

  db.collection('deposits')
    .where('uid', '==', user.uid)
    .onSnapshot(snap => {
      deposits = snap.docs.map(d => {
        const data = d.data();
        return {
          amount: data.claimedAmount || 0,
          date: formatDate(data.createdAt || data.timestamp),
          _t: sortTime(data.createdAt || data.timestamp),
          serial: data.referenceId || data.txnId || d.id,
          status: data.status || 'pending'
        };
      }).sort((a, b) => b._t - a._t);
      render(currentTab);
    });

  db.collection('withdrawals')
    .where('uid', '==', user.uid)
    .onSnapshot(snap => {
      withdrawals = snap.docs.map(d => {
        const data = d.data();
        return {
          amount: data.amount || 0,
          date: formatDate(data.createdAt || data.timestamp),
          _t: sortTime(data.createdAt || data.timestamp),
          serial: data.referenceId || data.txnId || d.id,
          status: data.status || 'pending'
        };
      }).sort((a, b) => b._t - a._t);
      render(currentTab);
    });
});
</script>

</body>
</html>
