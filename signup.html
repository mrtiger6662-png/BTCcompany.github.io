<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - ABC Company</title>
<style>
  body { margin:0; font-family:Arial, sans-serif; background:#0b0e11; color:#eaecef; display:flex; align-items:center; justify-content:center; height:100vh; }
  .box { background:#161a1e; padding:40px; border-radius:12px; width:320px; }
  .box h2 { margin-top:0; text-align:center; }
  .box input { width:100%; padding:12px; margin:8px 0; border-radius:6px; border:1px solid #474d57; background:#1e2329; color:#eaecef; box-sizing:border-box; }
  .box button { width:100%; padding:12px; margin-top:10px; border:none; border-radius:6px; background:#f0b90b; color:#202630; font-weight:bold; cursor:pointer; }
  .msg { text-align:center; margin-top:10px; font-size:14px; }
  a { color:#f0b90b; }

  .verify-overlay {
    display:none;
    position:fixed; inset:0; background:#0b0e11;
    align-items:center; justify-content:center;
    flex-direction:column; z-index:9999;
  }
  .verify-overlay.active { display:flex; }
  .verify-icon-wrap {
    width:90px; height:90px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:20px;
  }
  .verify-spinner {
    width:90px; height:90px; border-radius:50%;
    border:4px solid #2b3139;
    border-top:4px solid #f0b90b;
    animation: spin 0.9s linear infinite;
  }
  .verify-check {
    width:90px; height:90px; border-radius:50%;
    border:4px solid #0ecb81;
    display:flex; align-items:center; justify-content:center;
    font-size:40px; color:#0ecb81;
  }
  @keyframes spin {
    100% { transform:rotate(360deg); }
  }
  .verify-title {
    font-size:20px; font-weight:bold; color:#eaecef; margin-bottom:6px;
  }
  .verify-subtitle {
    font-size:13px; color:#848e9c;
  }
</style>
</head>
<body>
<div class="box">
  <h2>Create Account</h2>
  <input type="text" id="fullname" placeholder="Full Name">
  <input type="text" id="phone" placeholder="Email or Phone number">
  <input type="password" id="password" placeholder="Password">
  <button onclick="signUp()">Sign Up</button>
  <p class="msg" id="msg"></p>
  <p class="msg">Already have an account? <a href="login.html">Log In</a></p>
</div>

<div class="verify-overlay" id="verify-overlay">
  <div class="verify-icon-wrap" id="verify-icon-wrap">
    <div class="verify-spinner"></div>
  </div>
  <div class="verify-title" id="verify-title">Email Verification</div>
  <div class="verify-subtitle" id="verify-subtitle"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDJoPr8RvE1xkNTKRr5kwTx6E51GCMn_HE",
  authDomain: "abc-company-6272a.firebaseapp.com",
  projectId: "abc-company-6272a",
  storageBucket: "abc-company-6272a.firebasestorage.app",
  messagingSenderId: "1026212780106",
  appId: "1:1026212780106:web:985ec1bc35837d6320eeb3"
};
firebase.initializeApp(firebaseConfig);

async function getNextAccountId() {
  const counterRef = firebase.firestore().collection('counters').doc('users');
  const nextNumber = await firebase.firestore().runTransaction(async (t) => {
    const doc = await t.get(counterRef);
    let current = 1000;
    const existingCount = doc.exists ? doc.data().count : undefined;
    if (typeof existingCount === 'number' && !isNaN(existingCount)) {
      current = existingCount;
    }
    const next = current + 1;
    t.set(counterRef, { count: next });
    return next;
  });
  return 'AB' + nextNumber;
}

function signUp() {
  const fullName = document.getElementById('fullname').value.trim();
  const identifier = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');

  if (!fullName || !identifier || !password) {
    msg.style.color = 'red';
    msg.textContent = 'Please fill in all fields.';
    return;
  }

  const email = identifier.includes('@') ? identifier : identifier.replace(/\D/g,'') + '@abccompany-users.com';

  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
    .then(() => firebase.auth().createUserWithEmailAndPassword(email, password))
    .then(async userCredential => {
      const user = userCredential.user;
      const accountId = await getNextAccountId();
      return firebase.firestore().collection('users').doc(user.uid).set({
        fullName: fullName,
        accountId: accountId,
        identifier: identifier,
        email: email,
        balance: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    })
    .then(() => {
      const overlay = document.getElementById('verify-overlay');
      const iconWrap = document.getElementById('verify-icon-wrap');
      const title = document.getElementById('verify-title');
      const subtitle = document.getElementById('verify-subtitle');

      overlay.classList.add('active');

      setTimeout(() => {
        iconWrap.innerHTML = '<div class="verify-check">&#10003;</div>';
        title.textContent = 'Email Verified';
        subtitle.textContent = 'Your email address was successfully verified.';

        setTimeout(() => {
          window.location.href = 'market.html';
        }, 1000);
      }, 1500);
    })
    .catch(err => {
      msg.style.color = 'red';
      msg.textContent = err.message;
    });
}
</script>
</body>
</html>
