<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Admin Panel</title>
<style>
  :root{
    --bg:#0B0D12;
    --panel:#12151D;
    --panel-2:#181C27;
    --border:#242938;
    --gold:#F0B90B;
    --text:#F5F6FA;
    --text-dim:#8B93A7;
    --bubble-customer:#1E2330;
    --bubble-admin:#F0B90B;
    --danger:#EA3943;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;}
  .app{display:flex;height:100vh;}

  /* ---- sidebar : conversation list ---- */
  .sidebar{
    width:320px;flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
  }
  .sidebar-header{
    padding:18px 16px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .sidebar-header h1{font-size:16px;margin:0;}
  .sidebar-header .badge{
    background:var(--danger);color:#fff;font-size:11px;font-weight:700;
    padding:2px 8px;border-radius:10px;
  }
  .conv-list{flex:1;overflow-y:auto;}
  .conv-item{
    display:flex;gap:10px;padding:13px 16px;cursor:pointer;
    border-bottom:1px solid var(--border);
    align-items:center;
  }
  .conv-item:hover{background:var(--panel-2);}
  .conv-item.active{background:var(--panel-2);border-left:3px solid var(--gold);}
  .conv-item .avatar{
    width:36px;height:36px;border-radius:50%;background:#242938;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;
    color:var(--gold);flex-shrink:0;
  }
  .conv-item .info{flex:1;min-width:0;}
  .conv-item .info .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv-item .info .preview{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv-item .unread{
    background:var(--gold);color:#12151D;font-size:11px;font-weight:700;
    border-radius:10px;padding:1px 7px;flex-shrink:0;
  }
  .empty-list{padding:24px 16px;color:var(--text-dim);font-size:13px;text-align:center;}

  /* ---- main chat area ---- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .main .chat-header{
    padding:16px 20px;border-bottom:1px solid var(--border);background:var(--panel-2);
    display:flex;align-items:center;gap:12px;
  }
  .main .chat-header .name{font-weight:600;font-size:15px;}
  .main .chat-header .sub{font-size:12px;color:var(--text-dim);}
  .messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:60%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45;word-wrap:break-word;}
  .msg.customer{align-self:flex-start;background:var(--bubble-customer);border-bottom-left-radius:4px;}
  .msg.admin{align-self:flex-end;background:var(--bubble-admin);color:#12151D;border-bottom-right-radius:4px;}
  .msg .time{display:block;font-size:10px;opacity:.6;margin-top:4px;}
  .composer{display:flex;gap:8px;padding:14px;border-top:1px solid var(--border);background:var(--panel-2);}
  .composer input{
    flex:1;background:var(--bg);border:1px solid var(--border);border-radius:22px;
    padding:11px 16px;color:var(--text);font-size:14px;outline:none;
  }
  .composer input:focus{border-color:var(--gold);}
  .composer button{
    background:var(--gold);color:#12151D;border:none;border-radius:50%;
    width:42px;height:42px;font-size:16px;cursor:pointer;flex-shrink:0;
  }
  .placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px;}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>গ্রাহক চ্যাট</h1>
      <span class="badge" id="totalUnread" style="display:none;">0</span>
    </div>
    <div class="conv-list" id="convList">
      <div class="empty-list">কোনো চ্যাট নেই এখনো…</div>
    </div>
  </div>

  <div class="main" id="mainArea">
    <div class="placeholder">কথোপকথন দেখতে বামদিক থেকে একজন গ্রাহক বাছাই করুন</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  // ====== এখানে ঠিক একই Firebase কনফিগ বসান, যেটা live-support.html এ আছে ======
  const firebaseConfig = {
    apiKey: "AIzaSyDJoPr8RvE1xkNTKRr5kwTx6E51GCMn_HE",
    authDomain: "abc-company-6272a.firebaseapp.com",
    projectId: "abc-company-6272a",
    storageBucket: "abc-company-6272a.firebasestorage.app",
    messagingSenderId: "1026212780106",
    appId: "1:1026212780106:web:985ec1bc35837d6320eeb3"
  };
  // ============================================================================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const convList   = document.getElementById('convList');
  const mainArea   = document.getElementById('mainArea');
  const totalBadge = document.getElementById('totalUnread');

  let activeChatId = null;
  let unsubMessages = null;

  // --- conversation list, live updated, newest first ---
  db.collection('supportChats').orderBy('lastMessageAt', 'desc')
    .onSnapshot(snap => {
      if (snap.empty) {
        convList.innerHTML = '<div class="empty-list">কোনো চ্যাট নেই এখনো…</div>';
        totalBadge.style.display = 'none';
        return;
      }
      convList.innerHTML = '';
      let totalUnread = 0;

      snap.forEach(doc => {
        const c = doc.data();
        const unread = c.unreadByAdmin || 0;
        totalUnread += unread;

        const item = document.createElement('div');
        item.className = 'conv-item' + (doc.id === activeChatId ? ' active' : '');
        const initial = (c.customerName || '?').charAt(0).toUpperCase();
        item.innerHTML = `
          <div class="avatar">${initial}</div>
          <div class="info">
            <div class="name">${c.customerName || 'গ্রাহক'}</div>
            <div class="preview">${(c.lastMessage || '')}</div>
          </div>
          ${unread > 0 ? `<div class="unread">${unread}</div>` : ''}
        `;
        item.addEventListener('click', () => openChat(doc.id, c.customerName));
        convList.appendChild(item);
      });

      if (totalUnread > 0) {
        totalBadge.style.display = 'inline-block';
        totalBadge.textContent = totalUnread;
        document.title = `(${totalUnread}) Support Admin Panel`;
      } else {
        totalBadge.style.display = 'none';
        document.title = 'Support Admin Panel';
      }
    });

  function fmtTime(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date();
    return d.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
  }

  function openChat(chatId, name) {
    activeChatId = chatId;

    // read receipt: unread কাউন্ট রিসেট করা
    db.collection('supportChats').doc(chatId).set({ unreadByAdmin: 0 }, { merge: true });

    mainArea.innerHTML = `
      <div class="chat-header">
        <div>
          <div class="name">${name || 'গ্রাহক'}</div>
          <div class="sub">Chat ID: ${chatId}</div>
        </div>
      </div>
      <div class="messages" id="msgArea"></div>
      <div class="composer">
        <input id="replyInput" type="text" placeholder="রিপ্লাই লিখুন…" maxlength="1000">
        <button id="replyBtn">➤</button>
      </div>
    `;

    const msgArea    = document.getElementById('msgArea');
    const replyInput = document.getElementById('replyInput');
    const replyBtn   = document.getElementById('replyBtn');

    if (unsubMessages) unsubMessages(); // আগের চ্যাটের listener বন্ধ করা

    unsubMessages = db.collection('supportChats').doc(chatId).collection('messages')
      .orderBy('timestamp')
      .onSnapshot(snap => {
        msgArea.innerHTML = '';
        snap.forEach(d => {
          const m = d.data();
          const div = document.createElement('div');
          div.className = 'msg ' + m.sender;
          div.innerHTML = (m.text || '').replace(/</g,'&lt;') + '<span class="time">' + fmtTime(m.timestamp) + '</span>';
          msgArea.appendChild(div);
        });
        msgArea.scrollTop = msgArea.scrollHeight;
      });

    function sendReply() {
      const text = replyInput.value.trim();
      if (!text) return;
      replyInput.value = '';
      db.collection('supportChats').doc(chatId).collection('messages').add({
        sender: 'admin',
        text: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      db.collection('supportChats').doc(chatId).set({
        lastMessage: text,
        lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }

    replyBtn.addEventListener('click', sendReply);
    replyInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendReply(); });
    replyInput.focus();
  }
</script>
</body>
</html>
