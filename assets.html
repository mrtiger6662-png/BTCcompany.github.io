<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assets - ABC Company</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, sans-serif; background:#0b0e11; color:#eaecef; padding-bottom:70px; }
  header { padding:16px 20px; text-align:center; }
  header h1 { font-size:20px; margin:0; color:#f0b90b; }

  .balance-card {
    background:#161a1e; border-radius:12px; margin:16px; padding:20px;
  }
  .balance-title {
    display:flex; align-items:center; gap:6px;
    color:#848e9c; font-size:14px; margin-bottom:16px;
  }
  .balance-amount {
    display:flex; align-items:baseline; gap:8px; margin-bottom:6px;
  }
  .balance-amount .num { font-size:32px; font-weight:bold; }
  .balance-amount .cur { color:#848e9c; font-size:15px; }
  .balance-usd { color:#848e9c; font-size:13px; margin-bottom:20px; }
  .balance-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .balance-actions button {
    background:#1e2329; border:1px solid #2b3139; color:#eaecef;
    padding:12px 0; border-radius:8px; font-weight:bold; font-size:14px; cursor:pointer;
  }
  .balance-actions .btn-primary {
    background:#f0b90b;
    color:#0b0e11;
    border:1px solid #f0b90b;
  }
  .balance-actions .btn-secondary {
    background:#2354b8;
    color:#ffffff;
    border:1px solid #2354b8;
  }

  .card { background:#161a1e; border-radius:12px; margin:16px; padding:20px; }
  .card-title {
    color:#848e9c; font-size:13px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #1e2329; }
  .row:last-child { border-bottom:none; }
  .label { color:#848e9c; font-size:13px; }
  .value { font-weight:bold; word-break:break-all; text-align:right; max-width:60%; }

  /* Status badges for pending items */
  .status-badge {
    display:inline-block; padding:2px 10px; border-radius:12px;
    font-size:12px; font-weight:bold;
  }
  .status-pending {
    background:rgba(240,185,11,0.15); color:#f0b90b;
  }
  .status-approved {
    background:rgba(14,203,129,0.15); color:#0ecb81;
  }
  .status-rejected {
    background:rgba(246,70,93,0.15); color:#f6465d;
  }

  /* Profit / Loss badges for trades */
  .pl-badge {
    display:inline-block; padding:4px 10px; border-radius:8px;
    font-size:13px; font-weight:bold; white-space:nowrap;
  }
  .pl-profit { background:rgba(14,203,129,0.15); color:#0ecb81; }
  .pl-loss   { background:rgba(246,70,93,0.15); color:#f6465d; }

  /* Trade summary (total profit / total loss) */
  .summary-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;
  }
  .summary-box {
    background:#1e2329; border-radius:8px; padding:12px;
  }
  .summary-box .s-label { color:#848e9c; font-size:12px; margin-bottom:4px; }
  .summary-box .s-value { font-size:16px; font-weight:bold; }

  .bottom-nav {
    position:fixed; bottom:0; left:0; right:0; background:#161a1e;
    display:flex; justify-content:space-around; padding:10px 0;
    border-top:1px solid #2b3139;
  }
  .bottom-nav div { text-align:center; color:#848e9c; font-size:11px; cursor:pointer; }
  .bottom-nav div.active { color:#f0b90b; }
  .bottom-nav .ic {
    font-size:18px; width:38px; height:38px; line-height:38px;
    margin:0 auto 2px; border-radius:50%; transition:0.2s;
  }
  .bottom-nav div.active .ic {
    background:rgba(240,185,11,0.15);
    box-shadow:0 0 0 6px rgba(240,185,11,0.08);
  }
</style>
</head>
<body>
<header><h1>Assets</h1></header>

<div class="balance-card">
  <div class="balance-title">
    Est. Total Value
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </div>
  <div class="balance-amount">
    <span class="num" id="balanceNum">0.00</span>
    <span class="cur">USDT &#9662;</span>
  </div>
  <div class="balance-usd" id="balanceUsd">&#8776; $0.00</div>
</div>

<!-- Trades: profit / loss per trade -->
<div class="card" id="trades-card">
  <div class="card-title"><span>Recent Trades</span></div>
  <div id="trades-list">
    <div class="row"><span class="label">Loading...</span></div>
  </div>
  <div class="summary-grid">
    <div class="summary-box">
      <div class="s-label">Total Profit</div>
      <div class="s-value" id="totalProfit" style="color:#0ecb81;">+0.00 USDT</div>
    </div>
    <div class="summary-box">
      <div class="s-label">Total Loss</div>
      <div class="s-value" id="totalLoss" style="color:#f6465d;">-0.00 USDT</div>
    </div>
  </div>
</div>

<div class="card" id="assets-card">
  <div class="row"><span class="label">Loading...</span></div>
</div>

<div class="bottom-nav">
  <a href="market.html" style="text-decoration:none;"><div><div class="ic">&#128200;</div>Market</div></a>
  <a href="trade.html" style="text-decoration:none;"><div><div class="ic">&#128179;</div>Trade</div></a>
  <div class="active"><div class="ic">&#128188;</div>Assets</div>
  <a href="profile.html" style="text-decoration:none;"><div><div class="ic">&#128100;</div>Profile</div></a>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDJoPr8RvE1xkNTKRr5kwTx6E51GCMn_HE",
  authDomain: "abc-company-6272a.firebaseapp.com",
  projectId: "abc-company-6272a",
  storageBucket: "abc-company-6272a.firebasestorage.app",
  messagingSenderId: "1026212780106",
  appId: "1:1026212780106:web:985ec1bc35837d6320eeb3"
};
firebase.initializeApp(firebaseConfig);
firebase.auth().onAuthStateChanged(async user => {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }

  // ---- Real-time balance listener ----
  firebase.firestore().collection('users').doc(user.uid)
    .onSnapshot(doc => {
      if (doc.exists) {
        const data = doc.data();
        const balance = data.balance || 0;
        document.getElementById('balanceNum').textContent = balance.toFixed(2);
        document.getElementById('balanceUsd').textContent = `≈ $${balance.toFixed(2)}`;
      }
    });
  // -------------------------------------

  const db = firebase.firestore();

  // Turns a Firestore Timestamp (or missing value) into "DD Mon YYYY, HH:MM"
  function formatDate(ts) {
    if (!ts || !ts.toDate) return '—';
    const d = ts.toDate();
    return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) +
      ', ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  }

  // Maps a deposit/withdrawal's Firestore status to what the badge should show.
  function statusBadge(status) {
    if (status === 'approved') return { text: 'Success', cls: 'status-approved' };
    if (status === 'rejected') return { text: 'Reject', cls: 'status-rejected' };
    return { text: 'Pending', cls: 'status-pending' };
  }

  // ---- Trades: profit / loss list ----
  // Matches the real fields written by trade.html's placeTrade():
  //   uid, symbol, amount, expectedReturn, orderNumber, createdAt,
  //   status ("pending" while running, "completed" once resolved),
  //   result ("win" / "lose" / "tie", only set once completed)
  // Profit/loss is DERIVED here (trade.html doesn't store a "profit" field):
  //   win  -> +expectedReturn
  //   lose -> -amount (the stake is lost)
  //   tie  -> 0
  //   pending (not resolved yet) -> shown as "Pending", no P/L badge
  const tradesList = document.getElementById('trades-list');
  const totalProfitEl = document.getElementById('totalProfit');
  const totalLossEl = document.getElementById('totalLoss');

  function statusLabel(status) {
    if (status === 'completed') return 'Completed';
    if (status === 'pending') return 'Pending';
    if (status === 'error') return 'Error';
    return status;
  }

  function renderTradeRow(t) {
    const pending = t.status !== 'completed';
    const isProfit = t.profit >= 0;
    const sign = isProfit ? '+' : '';
    const badge = pending
      ? `<span class="status-badge status-pending">${statusLabel(t.status)}</span>`
      : `<span class="pl-badge ${isProfit ? 'pl-profit' : 'pl-loss'}">${sign}${t.profit.toFixed(2)} USDT</span>`;

    return `
      <div class="row">
        <span class="label">
          ${t.symbol}
          <div style="margin-top:4px; font-size:12px; color:#5e6673;">${t.date}</div>
          <div style="margin-top:2px; font-size:12px; color:#5e6673;">Ref: ${t.serial}</div>
        </span>
        <span class="value" style="text-align:right;">
          ${badge}
          ${pending ? '' : `<div style="margin-top:4px; font-size:12px; color:#5e6673;">${statusLabel(t.status)}</div>`}
        </span>
      </div>
    `;
  }

  function renderTrades(trades) {
    if (!trades.length) {
      tradesList.innerHTML = `<div class="row"><span class="label">No trades yet</span></div>`;
    } else {
      tradesList.innerHTML = trades.map(renderTradeRow).join('');
    }

    const completed = trades.filter(t => t.status === 'completed');
    const totalProfit = completed.filter(t => t.profit > 0).reduce((s, t) => s + t.profit, 0);
    const totalLoss = completed.filter(t => t.profit < 0).reduce((s, t) => s + t.profit, 0);
    totalProfitEl.textContent = `+${totalProfit.toFixed(2)} USDT`;
    totalLossEl.textContent = `${totalLoss.toFixed(2)} USDT`; // already negative
  }

  try {
    db.collection('trades')
      .where('uid', '==', user.uid)
      .onSnapshot(snap => {
        const trades = snap.docs.map(d => {
          const data = d.data();
          let profit = 0;
          if (data.result === 'win') profit = data.expectedReturn || 0;
          else if (data.result === 'lose') profit = -(data.amount || 0);
          // 'tie' or not yet resolved -> profit stays 0
          return {
            symbol: data.symbol || '—',                 // e.g. "ETHUSDT"
            profit: profit,
            status: data.status || 'pending',            // "pending" | "completed" | "error"
            date: formatDate(data.createdAt),
            serial: data.orderNumber || d.id
          };
        }).sort((a, b) => (b.date > a.date ? 1 : -1));
        renderTrades(trades);
      });
  } catch (e) {
    tradesList.innerHTML = `<div class="row"><span class="label">Failed to load trades</span></div>`;
  }
  // -------------------------------------

  // ---- Asset breakdown (deposits / withdrawals) ----
  const card = document.getElementById('assets-card');

  let deposits = [];    // [{ amount, date, serial, status }]
  let withdrawals = []; // [{ amount, date, serial, status }]

  function renderRow(label, item) {
    const badge = statusBadge(item.status);
    return `
      <div class="row">
        <span class="label">
          ${label}
          <div style="margin-top:4px; font-size:12px; color:#5e6673;">${item.date}</div>
          <div style="margin-top:2px; font-size:12px; color:#5e6673;">Ref: ${item.serial}</div>
        </span>
        <span class="value">${item.amount.toFixed(2)} USDT <span class="status-badge ${badge.cls}">${badge.text}</span></span>
      </div>
    `;
  }

  function renderCard() {
    let rows = '';
    deposits.forEach(dep => { rows += renderRow('Deposit', dep); });
    withdrawals.forEach(wd => { rows += renderRow('Withdrawal', wd); });
    card.innerHTML = rows;
  }

  try {
    db.collection('deposits')
      .where('uid', '==', user.uid)
      .onSnapshot(snap => {
        deposits = snap.docs.map(d => {
          const data = d.data();
          return {
            amount: data.claimedAmount || 0,
            date: formatDate(data.createdAt || data.timestamp),
            serial: data.referenceId || data.txnId || d.id,
            status: data.status || 'pending'
          };
        }).sort((a, b) => (b.date > a.date ? 1 : -1));
        renderCard();
      });

    db.collection('withdrawals')
      .where('uid', '==', user.uid)
      .onSnapshot(snap => {
        withdrawals = snap.docs.map(d => {
          const data = d.data();
          return {
            amount: data.amount || 0,
            date: formatDate(data.createdAt || data.timestamp),
            serial: data.referenceId || data.txnId || d.id,
            status: data.status || 'pending'
          };
        }).sort((a, b) => (b.date > a.date ? 1 : -1));
        renderCard();
      });
  } catch (e) {
    card.innerHTML = `<div class="row"><span class="label">Failed to load assets</span></div>`;
  }
});
</script>
</body>
</html>
