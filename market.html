function drawSparkline(canvas, prices, up) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  const min = Math.min(...prices), max = Math.max(...prices);
  ctx.beginPath();
  prices.forEach((p,i) => {
    const x = (i/(prices.length-1))*w;
    const y = h - ((p-min)/((max-min)||1))*h;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.strokeStyle = up ? '#0ecb81' : '#f6465d';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

async function loadMarket() {
  const tbody = document.getElementById('market-body');
  const highlightRow = document.getElementById('highlight-row');
  try {
    const tickerRes = await fetch('https://api.binance.com/api/v3/ticker/24hr');
    const allTickers = await tickerRes.json();
    const wantedSymbols = new Set(coinList.map(c => c.symbol));
    const tickers = allTickers.filter(t => wantedSymbols.has(t.symbol));

    tbody.innerHTML = '';
    highlightRow.innerHTML = '';

    for (const coin of coinList) {
      const ticker = tickers.find(t => t.symbol === coin.symbol);
      if (!ticker) continue;
      const changePercent = parseFloat(ticker.priceChangePercent);
      const up = changePercent >= 0;
      const price = parseFloat(ticker.lastPrice);
      const iconUrl = 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color/' + coin.icon + '.png';

      if (['BTCUSDT','ETHUSDT','XRPUSDT'].includes(coin.symbol)) {
        const hCard = document.createElement('div');
        hCard.className = 'highlight-card';
        hCard.innerHTML = `<div class="name">${coin.short}/USDT</div><div class="price ${up?'change-up':'change-down'}">$${price.toLocaleString(undefined,{maximumFractionDigits:4})}</div>`;
        highlightRow.appendChild(hCard);
      }

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>
          <div class="coin-name">
            <img src="${iconUrl}" onerror="this.style.visibility='hidden'">
            <div>${coin.short}/USDT<div class="coin-sub">${coin.name}</div></div>
          </div>
        </td>
        <td><canvas width="70" height="30" id="chart-${coin.symbol}"></canvas></td>
        <td>
          <div class="${up?'change-up':'change-down'}">${up?'+':''}${changePercent.toFixed(2)}%</div>
          <div>$${price.toLocaleString(undefined,{maximumFractionDigits:4})}</div>
        </td>`;
      tbody.appendChild(row);

      fetch(`https://api.binance.com/api/v3/klines?symbol=${coin.symbol}&interval=1h&limit=24`)
        .then(r => r.json())
        .then(klines => {
          const prices = klines.map(k => parseFloat(k[4]));
          prices.push(price); // add the live price so the chart moves with every refresh
          const canvas = document.getElementById('chart-' + coin.symbol);
          if (canvas) drawSparkline(canvas, prices, up);
        })
        .catch(() => {});
    }
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#f6465d;">Error: ' + err.message + '</td></tr>';
  }
}

async function loadForex() {
  const tbody = document.getElementById('market-body');
  const highlightRow = document.getElementById('highlight-row');
  tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#848e9c;">Loading...</td></tr>';
  highlightRow.innerHTML = '';

  const dateStrs = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    dateStrs.push(d.toISOString().split('T')[0]);
  }

  const bases = [...new Set(forexList.map(f => f.base))];
  const seriesByBase = {};
  let anySuccess = false;
  let lastError = '';

  await Promise.all(bases.map(async base => {
    const symbols = forexList.filter(f => f.base === base).map(f => f.quote).join(',');
    try {
      const results = await Promise.all(dateStrs.map(async date => {
        const res = await fetch(`https://api.frankfurter.dev/v1/${date}?base=${base}&symbols=${symbols}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }));
      seriesByBase[base] = results.map(r => r.rates);
      anySuccess = true;
    } catch (err) {
      lastError = err.message;
      seriesByBase[base] = null;
    }
  }));

  if (!anySuccess) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#f6465d;">Could not load forex data (' + lastError + '). Please try again shortly.</td></tr>';
    return;
  }

  tbody.innerHTML = '';

  forexList.forEach((fx, idx) => {
    const series = seriesByBase[fx.base];
    if (!series) return;
    const values = series.map(r => r[fx.quote]).filter(v => v !== undefined);
    if (values.length === 0) return;
    const latest = values[values.length - 1];
    const prevDay = values.length > 1 ? values[values.length - 2] : latest;
    const changePercent = ((latest - prevDay) / prevDay) * 100;
    const up = changePercent >= 0;

    if (idx < 3) {
      const hCard = document.createElement('div');
      hCard.className = 'highlight-card';
      hCard.innerHTML = `<div class="name">${fx.flag} ${fx.pair}</div><div class="price ${up?'change-up':'change-down'}">${latest.toLocaleString(undefined,{maximumFractionDigits:4})}</div>`;
      highlightRow.appendChild(hCard);
    }

    const row = document.createElement('tr');
    row.innerHTML = `
      <td>
        <div class="coin-name">
          <span style="font-size:20px;">${fx.flag}</span>
          <div>${fx.pair}<div class="coin-sub">${fx.base}/${fx.quote}</div></div>
        </div>
      </td>
      <td><canvas width="70" height="30" id="chart-fx-${fx.pair.replace('/','')}"></canvas></td>
      <td>
        <div class="${up?'change-up':'change-down'}">${up?'+':''}${changePercent.toFixed(2)}%</div>
        <div>${latest.toLocaleString(undefined,{maximumFractionDigits:4})}</div>
      </td>`;
    tbody.appendChild(row);

    const canvas = document.getElementById('chart-fx-' + fx.pair.replace('/',''));
    if (canvas && values.length > 1) drawSparkline(canvas, values, up);
  });

  if (tbody.innerHTML === '') {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#f6465d;">Could not load forex data. Please try again.</td></tr>';
  }
}

async function fetchStockWithRetry(symbol, retries = 2) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_API_KEY}`);
      if (res.status === 429) {
        await new Promise(r => setTimeout(r, 2000 * (attempt + 1)));
        continue;
      }
      if (!res.ok) return null;
      return await res.json();
    } catch (err) {
      await new Promise(r => setTimeout(r, 1000));
    }
  }
  return null;
}

async function loadStocks() {
  const tbody = document.getElementById('market-body');
  const highlightRow = document.getElementById('highlight-row');
  tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#848e9c;">Loading... (this may take a moment)</td></tr>';
  highlightRow.innerHTML = '';

  if (!FINNHUB_API_KEY || FINNHUB_API_KEY === 'YOUR_FINNHUB_API_KEY_HERE') {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#f6465d;">Please add your Finnhub API key in the code.</td></tr>';
    return;
  }

  tbody.innerHTML = '';
  let shown = 0;

  for (const s of stockList) {
    const q = await fetchStockWithRetry(s.symbol);
    if (!q || q.c === undefined || q.c === 0) {
      await new Promise(r => setTimeout(r, 400));
      continue;
    }

    const price = q.c;
    const changePercent = q.dp ?? 0;
    const up = changePercent >= 0;
    const logoUrl = `https://logo.clearbit.com/${s.domain}`;

    if (shown < 3) {
      const hCard = document.createElement('div');
      hCard.className = 'highlight-card';
      hCard.innerHTML = `<div class="name">${s.symbol}</div><div class="price ${up?'change-up':'change-down'}">$${price.toFixed(2)}</div>`;
      highlightRow.appendChild(hCard);
    }
    shown++;

    const row = document.createElement('tr');
    row.innerHTML = `
      <td>
        <div class="coin-name">
          <img src="${logoUrl}" onerror="this.style.visibility='hidden'">
          <div>${s.symbol}<div class="coin-sub">${s.name}</div></div>
        </div>
      </td>
      <td><canvas width="70" height="30" id="chart-stock-${s.symbol}"></canvas></td>
      <td>
        <div class="${up?'change-up':'change-down'}">${up?'+':''}${changePercent.toFixed(2)}%</div>
        <div>$${price.toFixed(2)}</div>
      </td>`;
    tbody.appendChild(row);

    const canvas = document.getElementById('chart-stock-' + s.symbol);
    if (canvas) drawSparkline(canvas, [q.pc, q.l, q.o, q.h, q.c], up);

    await new Promise(r => setTimeout(r, 400));
  }

  if (tbody.innerHTML === '') {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#f6465d;">Could not load stock data. Please try again shortly.</td></tr>';
  }
}
